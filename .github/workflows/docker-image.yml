name: Docker image

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths: ["MTAT_v3_1.ps1", "docker/**", "tests/**", "twin/**", "docker-compose.twin.yml", "docker-compose.yml", ".dockerignore", ".github/workflows/docker-image.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mtat

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sizing unit tests
        run: node tests/sizing.test.js

      # Real build: installs PowerCLI from PSGallery (the part that can't be faked).
      - name: Build image
        run: docker compose build

      - name: Smoke test (engine up, UI served, PowerCLI detected)
        run: |
          docker compose up -d
          curl -sf -o /dev/null --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8600/api/ping
          curl -sf http://127.0.0.1:8600/ | grep -q "Memory Tiering Assessment Tool"
          curl -sf http://127.0.0.1:8600/api/get-version-info | tee /dev/stderr | grep -vq '"CurrentPowerCli":"Unknown"'
          # TZ from docker-compose.yml (default Europe/Rome) must be honoured -- needs tzdata in the image.
          test "$(docker compose exec -T mtat pwsh -NoProfile -Command '[TimeZoneInfo]::Local.Id')" = "Europe/Rome"
          # Headless mode must not self-terminate when no browser connects (desktop mode does after 60s).
          sleep 75
          curl -sf -o /dev/null http://127.0.0.1:8600/api/ping
          docker compose logs

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Push to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG=$([[ "$GITHUB_REF" == refs/tags/* ]] && echo "${GITHUB_REF_NAME#v}" || echo "3.1-beta")
          docker tag mtat:3.1-beta "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  # End-to-end tests against the digital twin (#47): MTAT's real HTTP API, connect -> ranges ->
  # analyze, on every scenario in twin/scenarios/, checked against each scenario's "expect" block.
  # No PowerCLI and no vCenter involved, so this needs nothing from PSGallery.
  twin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image without PowerCLI
        run: docker compose -p mtat-twin -f docker-compose.yml -f docker-compose.twin.yml build

      - name: Run every twin scenario
        run: |
          for f in twin/scenarios/*.json; do
            name=$(basename "$f" .json)
            echo "::group::scenario $name"
            MTAT_TWIN=$name docker compose -p mtat-twin -f docker-compose.yml -f docker-compose.twin.yml up -d --force-recreate
            curl -sf -o /dev/null --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8601/api/ping
            if ! node tests/twin-e2e.js "$f" http://127.0.0.1:8601; then
              docker compose -p mtat-twin -f docker-compose.yml -f docker-compose.twin.yml logs
              exit 1
            fi
            if docker compose -p mtat-twin -f docker-compose.yml -f docker-compose.twin.yml logs | grep -q CRITICAL; then
              echo "CRITICAL entries in the engine log for scenario $name"; exit 1
            fi
            echo "::endgroup::"
          done
