# MTAT -- turn-key deployment.
#   docker compose up -d --build      then browse to http://localhost:8600
# See docker/README.md for details (remote access, corporate CAs, logs).
name: mtat

services:
  mtat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mtat:3.1-beta
    container_name: mtat
    restart: unless-stopped
    environment:
      MTAT_HEADLESS: "1"
      MTAT_PORT: "8600"
      MTAT_BIND_HOST: "+"
      TZ: ${TZ:-Europe/Rome}
    ports:
      # Published on the host's loopback only: MTAT has no login of its own and anyone who
      # reaches it can use the vCenter sessions it holds. Set MTAT_PUBLISH_ADDR=0.0.0.0 only
      # on a trusted network or behind an authenticating reverse proxy.
      - "${MTAT_PUBLISH_ADDR:-127.0.0.1}:${MTAT_HOST_PORT:-8600}:8600"
    volumes:
      - mtat-data:/var/lib/mtat

volumes:
  mtat-data:
